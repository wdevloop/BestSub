providers:
  USFastClean:
    output: "us_fast.yaml"
    lowerbound: 5
    rules:
      - order: speed
        desc: true
        restriction: re("^US$", country) && alive
      - order: delay
        restriction: delay < 50
  CNQuality:
    output: "cn_quality.yaml"
    rules:
      - order: map(speed >= 20000, 1, speed >= 10000, 2, 3)
        desc: false
        restriction: country == "CN" && speed > 2048
